<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stripe connected · gather</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#0b1020;color:#e5e7eb}
  main{max-width:440px;padding:32px;text-align:center}
  h1{font-size:22px;margin:0 0 8px;color:#fff}
  p{margin:0 0 20px;color:#9ca3af}
  .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn,button{font:600 14.5px system-ui;padding:10px 18px;border-radius:10px;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .primary{background:#22c55e;color:#052e16}
  .ghost{background:rgba(255,255,255,0.08);color:#e5e7eb;border:1px solid rgba(255,255,255,0.14)}
</style></head>
<body><main>
  <h1 id="t">Stripe setup complete</h1>
  <p id="p">Your studio is refreshing your Stripe status now. Return to your studio tab to turn on super chats.</p>
  <div class="acts">
    <a class="btn primary" id="backLink" href="/">Return to studio</a>
    <button class="ghost" id="closeBtn" type="button">Close this tab</button>
  </div>
</main>
<script>
  const qs = new URLSearchParams(location.search);
  const retry = qs.has('retry');
  const rawStudio = qs.get('studio') || '';
  const studio = /^[a-z0-9-]{4,40}$/i.test(rawStudio) ? rawStudio : '';
  if (retry) {
    document.getElementById('t').textContent = 'That Stripe link expired';
    document.getElementById('p').textContent = 'Return to your studio and click “Finish Stripe setup” to get a fresh link.';
  }
  const backLink = document.getElementById('backLink');
  if (studio) backLink.href = '/s/' + encodeURIComponent(studio);
  document.getElementById('closeBtn').addEventListener('click', () => {
    window.close();
    // If browser blocks window.close() (e.g. same-tab navigation), return to studio.
    setTimeout(() => { location.assign(backLink.href); }, 180);
  });
  const payload = { type: 'gather:stripe-done', retry, studio, ts: Date.now() };
  try { window.opener?.postMessage(payload, location.origin); } catch {}
  try { const bc = new BroadcastChannel('gather-stripe'); bc.postMessage(payload); bc.close(); } catch {}
  try { localStorage.setItem('gather:stripe-done', JSON.stringify(payload)); } catch {}
</script>
</body></html>
